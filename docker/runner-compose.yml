# Full fuko stack for a self-hosted runner: sidecar + pgvector + Ollama.
#
# From a clone of fuko-pr on the runner:
#   docker compose -f docker/runner-compose.yml up -d --build
#   docker compose -f docker/runner-compose.yml exec ollama ollama pull bge-m3
# The sidecar then listens on the host at http://<runner>:8000.

services:
  pg:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fuko
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: fuko
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuko"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

  sidecar:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sidecar
    depends_on:
      pg:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      FUKO_DATABASE_URL: postgresql://fuko:secret@pg:5432/fuko
      FUKO_EMBED_BASE_URL: http://ollama:11434/v1
      # This stack embeds with bge-m3, which is symmetric: it has to override
      # both knobs, not just the model. The code default is the asymmetric
      # Qwen3-Embedding-0.6B, whose query instruction would otherwise be
      # prepended to every query bge-m3 embeds while documents stayed raw --
      # 1024 well-formed dimensions and quietly worse retrieval, with no
      # marker, warning or re-embed to show for it.
      FUKO_EMBED_MODEL: bge-m3
      FUKO_EMBED_QUERY_PREFIX: ""
      FUKO_AUTH_TOKEN: ${FUKO_AUTH_TOKEN:?set FUKO_AUTH_TOKEN (e.g. openssl rand -hex 16) before starting the stack}
      # Where agentic session transcripts land, once runners are capturing them
      # with FUKO_TRANSCRIPT_DIR (#238). Unset means no store: the sidecar
      # starts and reviews run exactly as they do now, with transcripts staying
      # on whichever runner produced them. Runners need no credentials of their
      # own -- they POST /transcripts/<key> with the FUKO_TOKEN they already
      # hold. See docs/deployment.md.
      #
      # FUKO_TRANSCRIPT_STORE_BACKEND: file          # "" (off) | file | s3 | r2
      # FUKO_TRANSCRIPT_STORE_ROOT: /var/lib/fuko/transcript-blobs   # mount a volume, or the blobs die with the container
      # FUKO_TRANSCRIPT_STORE_BUCKET: fuko-transcripts       # s3/r2 instead of ROOT
      # FUKO_TRANSCRIPT_STORE_PREFIX: transcripts
      # FUKO_TRANSCRIPT_STORE_ENDPOINT_URL: https://<accountid>.r2.cloudflarestorage.com
    restart: unless-stopped
    ports:
      - "8000:8000"

volumes:
  pgdata: {}
  ollama: {}
