# fuko-pr review workflow — fuko-pr reviewing its OWN PRs (dogfood).
#
# Unlike the distributable template (workflows/pr-review.yml) and the consumer
# repos (shuanda, mepro) — which pin `uvx --from git+...@<commit>` to a released
# fuko-pr — this job runs the runner from the CHECKED-OUT PR code (`uv run fuko`)
# so a PR is reviewed by the very runner it is changing. That is what lets a PR
# that adds a feature (e.g. `[[review.compare]]` A/B) be exercised by that feature.
#
# Runner: the self-hosted homelab fleet (label `fuko-pr`, 3 runners), same as
# shuanda/mepro. It has Docker for PR-Agent's image, reaches the public z.ai /
# Ollama Cloud APIs, AND reaches the LAN knowledge sidecar (FUKO_URL) so the
# review injects learnings from the KB. On GitHub-hosted runners FUKO_URL would
# resolve to an unreachable host and the review would degrade to KB-less — still
# runs, just without injected learnings.
#
# Concurrent A/B under two App identities: branch a (GLM-5.2) posts as fuko-dorian,
# branch b (qwen3.8-max) as fuko-gray. Each App = a repo VARIABLE (App ID) + secret
# (private key): FUKO_DORIAN_APP_ID/FUKO_DORIAN_APP_PRIVATE_KEY and
# FUKO_GRAY_APP_ID/FUKO_GRAY_APP_PRIVATE_KEY. With only one App the A/B runs
# sequentially under it; with none it posts as github-actions[bot]. Observe-only —
# posts reviews, gates nothing.

name: fuko-pr review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: fuko-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and never run fork-PR head code with this repo's secrets.
    if: ${{ github.event.pull_request.draft == false && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, fuko-pr] # self-hosted homelab fleet; reaches the LAN sidecar (FUKO_URL) for KB injection
    # Keep this ABOVE fuko-pr's worst-case budget so the graceful per-tool
    # timeout + docker kill fire before GitHub cancels the job mid-tool: the
    # sequential-fallback A/B is 2 branches * 2 tools * 600s = 40m + ~5m setup
    # ≈ 45m (the concurrent path is ~2 * 600s + setup ≈ 23m). Found on
    # mepro#1455, where every reviewer flagged the zero-headroom 40m cap.
    #
    # STOPGAP for #106 — 50 -> 110. When CodeRabbit pauses, backup escalation
    # promotes EVERY backup to active (runner.py: `actives = [*actives,
    # *(m.model_copy(update={"role": "active"}) for m in backups)]`), and a
    # promoted backup carries no token_env, so identity resolution fails and the
    # WHOLE run degrades to sequential. Count branches from the config, not from
    # the active count: 2 actives + 2 backups = 4 branches * 2 tools * 600s =
    # 80m + ~5m setup ≈ 85m. That overruns the old 50m cap outright and leaves
    # only ~5m under a 90m one — and an overrun kills the run mid-review, which
    # is worse than a slow round because a starved round is indistinguishable
    # from a clean one.
    #
    # Note the coupling: this number is a function of the BACKUP COUNT, so
    # adding a backup to .fuko.toml silently raises the escalated worst case by
    # 2 * tool_timeout. #106 is the real fix (make escalation identity- and
    # budget-aware, and skip a promotion that would collapse concurrency);
    # once it lands this cap should come back down.
    #
    # Deliberately NOT paired with a tool_timeout raise: the per-tool budget is
    # the thing keeping a wedged tool from eating the whole job.
    timeout-minutes: 110
    permissions:
      contents: read # reads PR data + posts comments only; no commits/pushes
      pull-requests: write
      issues: write
    steps:
      # Two App identities for concurrent A/B: branch a (GLM-5.2) posts as
      # fuko-dorian, branch b (qwen3.8-max) as fuko-gray, so the runner reviews under
      # per-branch tokens (distinct throttle buckets + author separation). Each App
      # is configured by a repo VARIABLE (App ID) + secret (private key); App IDs
      # aren't secret material, and keeping them in `vars` makes the mint gates
      # below plain data-presence checks.
      # If the gray App is absent the runner degrades to a sequential single-token
      # A/B; if both are absent it falls back to github-actions[bot].
      - name: Mint fuko-dorian app token
        id: app-token-dorian
        if: ${{ vars.FUKO_DORIAN_APP_ID != '' }}
        continue-on-error: true # minting failure (App uninstalled, etc.) falls back rather than failing the PR check
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.FUKO_DORIAN_APP_ID }}
          private-key: ${{ secrets.FUKO_DORIAN_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: Mint fuko-gray app token
        id: app-token-gray
        if: ${{ vars.FUKO_GRAY_APP_ID != '' }}
        continue-on-error: true # absent/failed gray App degrades to sequential single-token A/B
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.FUKO_GRAY_APP_ID }}
          private-key: ${{ secrets.FUKO_GRAY_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      # henry, the agentic trial seat (.fuko.toml). Until this App is created
      # and installed, the skipped mint leaves FUKO_GITHUB_TOKEN_HENRY empty and
      # every round runs sequentially — the identity rule is all-or-nothing
      # across actives AND trials (#106), so one missing seat identity costs the
      # whole round its concurrency, not just henry's branch.
      - name: Mint fuko-henry app token
        id: app-token-henry
        if: ${{ vars.FUKO_HENRY_APP_ID != '' }}
        continue-on-error: true # absent/failed henry App degrades to sequential single-token A/B
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.FUKO_HENRY_APP_ID }}
          private-key: ${{ secrets.FUKO_HENRY_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      # Make a failed mint LOUD: continue-on-error above hides the failure from
      # the job status (the step still reports success), the token output comes
      # out empty, and the runner then silently degrades — gray missing means
      # sequential A/B under dorian, dorian missing means github-actions[bot].
      # `outcome` is the pre-continue-on-error result, so it sees the failure;
      # a skipped mint (App intentionally unconfigured) stays silent.
      # (Found on mepro#1455: a bad gray PEM 401'd and nothing flagged it.)
      - name: Surface App token mint failures
        if: ${{ steps.app-token-dorian.outcome == 'failure' || steps.app-token-gray.outcome == 'failure' || steps.app-token-henry.outcome == 'failure' }}
        env:
          DORIAN_OUTCOME: ${{ steps.app-token-dorian.outcome }}
          GRAY_OUTCOME: ${{ steps.app-token-gray.outcome }}
          HENRY_OUTCOME: ${{ steps.app-token-henry.outcome }}
        run: |
          if [ "$DORIAN_OUTCOME" = "failure" ]; then
            echo "::warning title=fuko-dorian App token mint failed::check vars.FUKO_DORIAN_APP_ID / secrets.FUKO_DORIAN_APP_PRIVATE_KEY and the App installation; the base identity falls back to fuko-gray, then github-actions[bot]"
          fi
          if [ "$GRAY_OUTCOME" = "failure" ]; then
            echo "::warning title=fuko-gray App token mint failed::check vars.FUKO_GRAY_APP_ID / secrets.FUKO_GRAY_APP_PRIVATE_KEY and the App installation; the A/B falls back to sequential under the base identity"
          fi
          if [ "$HENRY_OUTCOME" = "failure" ]; then
            echo "::warning title=fuko-henry App token mint failed::check vars.FUKO_HENRY_APP_ID / secrets.FUKO_HENRY_APP_PRIVATE_KEY and the App installation; the WHOLE round falls back to sequential under the base identity"
          fi

      # Bring the PR's code + .fuko.toml into the workspace; the runner is then
      # built from this checkout (dogfood), not a pinned release.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # uv is self-contained and brings its own Python. Pin it.
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.22"

      - name: Review
        env:
          # Base identity for PR reads + the sequential fallback: whichever App
          # token minted (dorian preferred), else github-actions[bot] — so a
          # single configured App drives the sequential A/B under its own
          # identity regardless of which one it is.
          GITHUB_TOKEN: ${{ steps.app-token-dorian.outputs.token || steps.app-token-gray.outputs.token || github.token }}
          # Per-branch identities for concurrent A/B — referenced by token_env in
          # .fuko.toml. Each is the App token or EMPTY (no github.token fallback):
          # an unminted App must leave its var empty so _resolve_branch_identities
          # falls back to sequential rather than racing fuko-gray against
          # github-actions[bot]. Concurrency activates only when both resolve to
          # distinct actors; otherwise the run is sequential under GITHUB_TOKEN.
          FUKO_GITHUB_TOKEN_DORIAN: ${{ steps.app-token-dorian.outputs.token }}
          FUKO_GITHUB_TOKEN_GRAY: ${{ steps.app-token-gray.outputs.token }}
          FUKO_GITHUB_TOKEN_HENRY: ${{ steps.app-token-henry.outputs.token }}
          # Knowledge base: the LAN fuko sidecar reached from the self-hosted
          # runner. If unreachable the review degrades to KB-less — harmless, just
          # no injected learnings.
          FUKO_URL: ${{ secrets.FUKO_URL }}
          FUKO_TOKEN: ${{ secrets.FUKO_TOKEN }}
          # Reviewer model keys for the .fuko.toml A/B pool: GLM-5.2 via z.ai
          # (zai-coding, branch a) and a model via OpenRouter (openrouter,
          # branch b). Separate keys = separate throttle buckets. OLLAMA_API_KEY
          # covers the ollama-cloud BACKUP entry: without it an OpenRouter
          # outage cools gray and its OpenRouter backup together, and the only
          # surviving failover would then fail to authenticate.
          ZAI_KEY: ${{ secrets.ZAI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          # henry's agentic trial seat (qwen-anthropic preset): the QwenCloud
          # Token Plan key (sk-sp-…). Distinct from every other bucket above —
          # a QwenCloud throttle cools only henry.
          QWEN_TOKEN_PLAN_KEY: ${{ secrets.QWEN_TOKEN_PLAN_KEY }}
          # Pass the PR URL through the environment rather than expanding
          # ${{ github.event... }} directly in run: (avoids shell injection).
          PR_URL: ${{ github.event.pull_request.html_url }}
        # `uv run` syncs the checkout's deps and runs its `fuko` entry point, so the
        # PR's own runner code performs the review.
        run: uv run fuko review --pr-url "$PR_URL"
