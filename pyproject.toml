[project]
name = "fuko-pr"
version = "0.7.4"
description = "A vendor-neutral layer over PR review bots, with a knowledge base you own"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "fuko-pr contributors" }]
dependencies = [
    "fastapi>=0.115",
    # HTML form and file-upload parsing for the /ui console. Starlette delegates
    # multipart to this; the stdlib has no equivalent worth hand-rolling.
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# ruff is pinned exactly (and mirrored in ci.yml's `pip install`) so dev and CI
# can't drift: 0.16 started reformatting Markdown code fences, which broke CI
# while local 0.15 passed.
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.16.3"]
# Bucket-backed object storage, for EITHER store in `sidecar.objectstore`: the
# knowledge file's s3/r2 backend and the transcript blob store's (#238). Its own
# extra because the sidecar image needs the second without the first --
# `docker/Dockerfile.sidecar` installs `.[s3]`, and pulling in `sqlite` there
# would add a vector extension the Postgres deployment never loads.
#
# boto3>=1.36: botocore only grew `IfNoneMatch` on `PutObject` during the
# 1.35 series (absent in 1.34.x and 1.35.0, present by 1.35.36), and
# `S3BlobStore.put` depends on it for write-once. An older botocore raises
# ParamValidationError before the request leaves the process, so the floor
# is part of the guarantee rather than a nicety.
s3 = ["boto3>=1.36"]
# Server-free knowledge store: a sqlite-vec file synced to S3/R2 object storage.
sqlite = ["sqlite-vec>=0.1.6", "boto3>=1.36"]

[project.scripts]
fuko = "sidecar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sidecar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Keep the formatter off Markdown code fences (ruff >= 0.16 formats them): the
# doc snippets deliberately hand-align trailing comments for readability.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "D"]
ignore = ["D203", "D211", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
addopts = "--cov=sidecar --cov-report=term-missing"

[tool.coverage.run]
source = ["sidecar"]

[tool.coverage.report]
fail_under = 80
show_missing = true
