[review]
image = "ghcr.io/lemehmet/pr-agent:0.41.0@sha256:7341dc6214be964534ce3e68fc73143f3d642240829fe66894b87864db417223"
# 600 -> 900 -> 1800 (2026-08-19): henry's agentic runs were KILLED at 600s
# AND at 900s (receipts on PR #130). Measured cause, not guessed: the QwenCloud
# token-plan gateway forces THINKING mode on (a bare /v1/messages call returns
# thinking blocks unrequested) at ~35 tok/s, so every agentic tool-call turn
# pays a few hundred reasoning tokens first — a healthy agentic review of a
# ~20-file PR is tens of minutes on this endpoint. The per-tool budget still
# exists to kill genuine wedges; it just has to sit above the honest cost of
# the slowest healthy tool. If henry STILL times out at 1800s, that is A/B
# evidence on the latency/cost axis, not a number to bump again blindly.
tool_timeout = 1800
# `improve` DROPPED 2026-08-19: gray's improve timed out in every observed
# round on this repo (600s and 900s — pure burned wall-clock), and a second
# tool at tool_timeout=1800 would put the sequential worst case at
# 3 branches * 2 tools * 1800s = 180m, over the 110m job cap. Review-only
# keeps it at 3 * 1 * 1800s = 90m. Cost: dorian's (working) inline
# suggestions on this dogfood repo — acceptable while the agentic A/B runs;
# revisit when the experiment concludes.
#
# `tools` must be set EXPLICITLY: it defaults to ["review", "improve"], and
# `optional_tools` only decides whether a tool's failure is fatal — it does
# not remove the tool from the run. The first cut of this change edited only
# optional_tools, which kept improve running AND promoted its chronic timeout
# from warning to branch failure. Caught by henry (the agentic trial seat) on
# its first completed review, round 3 of PR #130.
tools = ["review"]
optional_tools = []
# Must equal `timeout-minutes` in .github/workflows/fuko-pr-review.yml. The
# runner uses it to refuse a backup promotion whose sequential worst case
# (branches * tools * tool_timeout) would not fit the job -- an overrun kills the
# run mid-review, and a starved round is indistinguishable from a clean one.
# Keeping the number here means the arithmetic is checked at run time instead of
# being re-derived by hand whenever a backup is added (#106).
#
# Recomputed for tool_timeout=1800, review-only, 2-seat fleet (2026-08-30):
# sequential worst case 2 branches * 1 tool * 1800s = 60 min + ~5m setup, and
# the CONCURRENT path (both Apps minting) is ~1800s + setup ≈ 35 min. There is
# now headroom for a promotion on paper — but the fleet mixes drivers, so
# `plan_escalation` promotes nothing regardless (see the fleet notes below).
# Every number here is `branches * tools * tool_timeout`; recompute from the
# formula rather than adjusting by feel.
#
# HONESTY LIMIT of that formula (henry finding, PR #130 round 4 → issue #131):
# it charges each branch ONE attempt, but a timeout is throttle-class and
# fails over, so a pathological round where primaries AND same-driver backups
# all time out can exceed the cap and be killed by GitHub mid-review. The
# formula prices the expected case; the job cap is the backstop for the
# pathological one. Failover-aware budget arithmetic is #131's scope.
job_budget_minutes = 110

# FLEET COMPOSITION (2026-08-30) — one diff seat, one agentic seat, one backup
# each. Both gating.
#
# WHY THIS FLEET LOOKS CHEAP. It is. The seats on THIS repo are not here to QA
# fuko-pr's own PRs — they are here to exercise fuko-pr's two review paths
# (PR-Agent diff review and the agentic checkout-walking driver) on every PR so
# regressions in the runner surface as failed or malformed reviews. Optimise for
# covering both code paths at the lowest token cost, not for review quality; the
# quality bar is CodeRabbit's, and mehmet's. Do not "upgrade" these seats back to
# expensive models on quality grounds without changing that premise first.
#
# WHY deepseek-v4-pro IS BACK, and only as a BACKUP. It previously held the
# `gray` gating seat and was dropped 2026-08-14 for confidently wrong findings —
# the deciding one, on PR #100, filed a CRITICAL claiming the deny rules used a
# single leading slash and shipped a patch producing the silently non-matching
# `Read(///…)` form, i.e. it would have DISABLED the credential denylist it
# claimed to protect. That history is why it is a backup and not a seat: it only
# runs when solar-pro4's provider throttles, on a repo where the premise above
# says these seats validate plumbing rather than gate on judgement. If this fleet
# is ever copied to a repo where fuko's verdict is load-bearing (mepro,
# shuanda), drop this entry first.
#
# THROTTLE BUCKET, stated plainly: the diff seat and its backup BOTH ride
# OPENROUTER_KEY, and cooldown is global per provider (`order_pool` in
# sidecar/pool.py keys `cooled` by provider id). One OpenRouter throttle cools
# both, so the diff branch has no surviving failover — and the agentic backup
# cannot rescue it, because `_compatible_backups` keeps only SAME-driver
# backups. Accepted: an OpenRouter outage costs the diff path for that round and
# leaves an honest "pool exhausted" receipt, which is itself the signal.
#
# ESCALATION IS FROZEN BY CONSTRUCTION. A mixed-backend fleet gives
# `plan_escalation` no single driver to promote a backup into, so it promotes
# nothing (fail-closed, sidecar/runner.py). Unchanged from the henry-era fleet;
# the backups still serve their real job, which is per-branch failover.
#
# BUDGET. 2 branches * 1 tool * 1800s = 60 min sequential worst case, inside
# job_budget_minutes = 110 with room. Concurrent (both Apps minting) is ~35 min.

# dorian — gating seat, diff path (PR-Agent). max_context is OpenRouter's
# reported context_length for this model (524288), not the provider preset's
# 1048576 default: overstating it invites a mid-review context error instead of
# PR-Agent's own compression.
[[review.models]]
provider = "openrouter"
name = "upstage/solar-pro4"
max_context = 524288
token_env = "FUKO_GITHUB_TOKEN_DORIAN"

# henry — gating seat, agentic path (headless Claude Code against QwenCloud's
# Anthropic-compatible Token Plan endpoint). Distinct token_env from dorian:
# two resolvable identities is what keeps the round concurrent; collapse them
# and it degrades to sequential (#106).
#
# auth is PINNED to api-key: `auto` on a runner with a logged-in Claude session
# would resolve to subscription mode, which never injects a base URL — the seat
# would silently review with real Claude, the exact substitution class receipts
# exist to catch.
[[review.models]]
provider = "qwen-anthropic"
name = "qwen3.8-max"
max_context = 1000000
auth = "api-key"
backend = "agentic"
token_env = "FUKO_GITHUB_TOKEN_HENRY"

# Backup for the diff path. Backups intentionally carry no token_env: a promoted
# backup posts under the identity of the seat it covers.
[[review.models]]
provider = "openrouter"
name = "deepseek/deepseek-v4-pro-0813"
max_context = 1048576
role = "backup"

# Backup for the agentic path. `backend = "agentic"` is REQUIRED, not decorative:
# `_compatible_backups` filters a branch's pool to same-driver entries, so
# without it the agentic seat has an EMPTY pool and any throttle ends the branch.
# Provider is `zai-anthropic` (z.ai's Anthropic-compatible surface), not the
# `zai-coding` OpenAI-shaped one — the agentic driver speaks the Anthropic API.
# The `glm-5.3` slug is confirmed to exist in the GLM 5.3 family but NOT yet
# verified against this account's z.ai plan; the first failover that lands here
# is the verification, and an unrecognized_model receipt is the expected shape of
# a wrong guess.
[[review.models]]
provider = "zai-anthropic"
name = "glm-5.3"
max_context = 1000000
auth = "api-key"
backend = "agentic"
role = "backup"
