[review]
image = "ghcr.io/lemehmet/pr-agent:0.41.0@sha256:7341dc6214be964534ce3e68fc73143f3d642240829fe66894b87864db417223"
# 600 -> 900 -> 1800 (2026-08-19): henry's agentic runs were KILLED at 600s
# AND at 900s (receipts on PR #130). Measured cause, not guessed: the QwenCloud
# token-plan gateway forces THINKING mode on (a bare /v1/messages call returns
# thinking blocks unrequested) at ~35 tok/s, so every agentic tool-call turn
# pays a few hundred reasoning tokens first — a healthy agentic review of a
# ~20-file PR is tens of minutes on this endpoint. The per-tool budget still
# exists to kill genuine wedges; it just has to sit above the honest cost of
# the slowest healthy tool. If henry STILL times out at 1800s, that is A/B
# evidence on the latency/cost axis, not a number to bump again blindly.
tool_timeout = 1800
# `improve` DROPPED 2026-08-19: gray's improve timed out in every observed
# round on this repo (600s and 900s — pure burned wall-clock), and a second
# tool at tool_timeout=1800 would put the sequential worst case at
# 3 branches * 2 tools * 1800s = 180m, over the 110m job cap. Review-only
# keeps it at 3 * 1 * 1800s = 90m. Cost: dorian's (working) inline
# suggestions on this dogfood repo — acceptable while the agentic A/B runs;
# revisit when the experiment concludes.
#
# `tools` must be set EXPLICITLY: it defaults to ["review", "improve"], and
# `optional_tools` only decides whether a tool's failure is fatal — it does
# not remove the tool from the run. The first cut of this change edited only
# optional_tools, which kept improve running AND promoted its chronic timeout
# from warning to branch failure. Caught by henry (the agentic trial seat) on
# its first completed review, round 3 of PR #130.
tools = ["review"]
optional_tools = []
# Must equal `timeout-minutes` in .github/workflows/fuko-pr-review.yml. The
# runner uses it to refuse a backup promotion whose sequential worst case
# (branches * tools * tool_timeout) would not fit the job -- an overrun kills the
# run mid-review, and a starved round is indistinguishable from a clean one.
# Keeping the number here means the arithmetic is checked at run time instead of
# being re-derived by hand whenever a backup is added (#106).
#
# Recomputed for tool_timeout=1800, review-only, 3-seat fleet (2026-08-31):
# sequential worst case 3 branches * 1 tool * 1800s = 90 min + ~5m setup, inside
# job_budget_minutes = 110. Concurrent (all three Apps minting) is ~35 min. A
# FOURTH branch would be 120 min and does NOT fit — that arithmetic, plus fuko-pr
# holding only three App identities, is why #159's A/B replaced the diff seat
# instead of being added beside it. Every number here is
# `branches * tools * tool_timeout`; recompute from the formula, never by feel.
#
# HONESTY LIMIT of that formula (henry finding, PR #130 round 4 → issue #131):
# it charges each branch ONE attempt, but a timeout is throttle-class and
# fails over, so a pathological round where primaries AND same-driver backups
# all time out can exceed the cap and be killed by GitHub mid-review. The
# formula prices the expected case; the job cap is the backstop for the
# pathological one. Failover-aware budget arithmetic is #131's scope.
job_budget_minutes = 110

# FLEET COMPOSITION (2026-08-31) — one gating seat, two trial seats running
# epic #160's stateful-vs-stateless A/B (#159).
#
# WHY dorian IS GONE. The diff seat (openrouter/upstage/solar-pro4) was retired
# on its receipts: roughly 3 valid findings out of ~40 across four issues
# (#186, #189, #192, #197), including 18 consecutive declines on #197, several
# resting on demonstrable factual errors about the code it was reviewing. That
# is the same standard that retired deepseek-v4-pro from a gating seat in
# 2026-08: a seat whose findings cost more attention to refute than they add is
# worse than an empty seat. ACCEPTED COST, stated plainly: nothing exercises the
# PR-Agent diff path on this repo any more. If that path regresses, this fleet
# will not notice. Re-add a diff seat (on a different model) when the A/B ends.
# The pr-agent backup went with it — `_compatible_backups` keeps only
# SAME-driver backups, so with no pr-agent branch it could never be reached.
#
# THE A/B. #159 scores the stateful reviewer against the stateless one on the
# SAME model, so the state is the only variable, exactly as the 2026-08-19
# agentic-vs-diff trial held the model fixed and varied the harness. Both trial
# seats are non-gating; henry keeps the gate.
#
# KNOWN GAP, and #159's first task: a truly stateless control is NOT expressible
# in config today. `coverage_ledger` (Tier 2, #157) is per-entry, but Tier 1's
# findings ledger is called UNCONDITIONALLY — `carry_in`/`settle` in
# sidecar/backends/agentic.py run for every agentic seat. So as configured below
# the experiment varies Tier 2 ONLY, and the control still carries findings
# across rounds. #159 must add a per-entry gate for the findings ledger before
# its receipts can answer the question the issue actually asks. Do not read the
# seat names as if that gate already exists.
#
# Tier 3 (repo-level digests, #158) is gated by the FUKO_DIGEST_RETRIEVAL env
# var, which is global rather than per-entry and is OFF. It is not part of this
# A/B; turning it on would change both arms at once.

# henry — the GATING seat, and the control's twin: same provider, same model,
# same harness. Kept gating so a round still has a reviewer that is not part of
# the experiment.
#
# auth is PINNED to api-key: `auto` on a runner with a logged-in Claude session
# would resolve to subscription mode, which never injects a base URL — the seat
# would silently review with real Claude, the exact substitution class receipts
# exist to catch.
[[review.models]]
provider = "qwen-anthropic"
name = "qwen3.8-max"
max_context = 1000000
auth = "api-key"
backend = "agentic"
token_env = "FUKO_GITHUB_TOKEN_HENRY"

# A/B control — stateless arm. Inherits dorian's retired App identity; the name
# on the App no longer describes the seat, which is why receipts are scored by
# provider/model and role, never by bot login.
[[review.models]]
provider = "qwen-anthropic"
name = "qwen3.8-max"
max_context = 1000000
auth = "api-key"
backend = "agentic"
role = "trial"
coverage_ledger = false
token_env = "FUKO_GITHUB_TOKEN_DORIAN"

# A/B treatment — stateful arm. The ONLY configured difference from the control
# is `coverage_ledger`; keep it that way or the experiment stops having one
# variable.
[[review.models]]
provider = "qwen-anthropic"
name = "qwen3.8-max"
max_context = 1000000
auth = "api-key"
backend = "agentic"
role = "trial"
coverage_ledger = true
token_env = "FUKO_GITHUB_TOKEN_GRAY"

# The only backup, and it is currently BROKEN — kept deliberately. z.ai answers
# `1113` ("insufficient balance or no resource package") for every model on both
# its surfaces, verified by hand 2026-08-31 against `/api/anthropic` AND
# `/api/coding/paas/v4`, while the z.ai UI showed usage well below quota. That
# rules out both a wrong model slug and a surface-entitlement problem; the
# account state and the API disagree, so it reads as a z.ai-side incident or a
# broken limiter. Do NOT re-diagnose this as a bad `glm-5.3` slug — the slug was
# never reached. A failed failover costs ~3 min and leaves an honest
# "pool exhausted" receipt, which beats declaring no backup at all; the next
# qwen exhaustion is a free live test of whether z.ai has recovered.
#
# `backend = "agentic"` is REQUIRED, not decorative: `_compatible_backups`
# filters a branch's pool to same-driver entries, so without it every seat above
# has an EMPTY pool. Provider is `zai-anthropic`, not the OpenAI-shaped
# `zai-coding` — the agentic driver speaks the Anthropic API.
[[review.models]]
provider = "zai-anthropic"
name = "glm-5.3"
max_context = 1000000
auth = "api-key"
backend = "agentic"
role = "backup"
