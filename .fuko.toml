[review]
image = "ghcr.io/lemehmet/pr-agent:0.41.0@sha256:7341dc6214be964534ce3e68fc73143f3d642240829fe66894b87864db417223"
# 600 -> 900 -> 1800 (2026-08-19): henry's agentic runs were KILLED at 600s
# AND at 900s (receipts on PR #130). Measured cause, not guessed: the QwenCloud
# token-plan gateway forces THINKING mode on (a bare /v1/messages call returns
# thinking blocks unrequested) at ~35 tok/s, so every agentic tool-call turn
# pays a few hundred reasoning tokens first — a healthy agentic review of a
# ~20-file PR is tens of minutes on this endpoint. The per-tool budget still
# exists to kill genuine wedges; it just has to sit above the honest cost of
# the slowest healthy tool. If henry STILL times out at 1800s, that is A/B
# evidence on the latency/cost axis, not a number to bump again blindly.
tool_timeout = 1800
# `improve` DROPPED 2026-08-19: gray's improve timed out in every observed
# round on this repo (600s and 900s — pure burned wall-clock), and a second
# tool at tool_timeout=1800 would put the sequential worst case at
# 3 branches * 2 tools * 1800s = 180m, over the 110m job cap. Review-only
# keeps it at 3 * 1 * 1800s = 90m. Cost: dorian's (working) inline
# suggestions on this dogfood repo — acceptable while the agentic A/B runs;
# revisit when the experiment concludes.
#
# `tools` must be set EXPLICITLY: it defaults to ["review", "improve"], and
# `optional_tools` only decides whether a tool's failure is fatal — it does
# not remove the tool from the run. The first cut of this change edited only
# optional_tools, which kept improve running AND promoted its chronic timeout
# from warning to branch failure. Caught by henry (the agentic trial seat) on
# its first completed review, round 3 of PR #130.
tools = ["review"]
optional_tools = []
# Must equal `timeout-minutes` in .github/workflows/fuko-pr-review.yml. The
# runner uses it to refuse a backup promotion whose sequential worst case
# (branches * tools * tool_timeout) would not fit the job -- an overrun kills the
# run mid-review, and a starved round is indistinguishable from a clean one.
# Keeping the number here means the arithmetic is checked at run time instead of
# being re-derived by hand whenever a backup is added (#106).
#
# Recomputed for tool_timeout=1800, review-only, 3-seat fleet (2026-08-31):
# sequential worst case 3 branches * 1 tool * 1800s = 90 min + ~5m setup, inside
# job_budget_minutes = 110. Concurrent (all three Apps minting) is ~35 min. A
# FOURTH branch would be 120 min and does NOT fit — that arithmetic, plus fuko-pr
# holding only three App identities, is why #159's A/B replaced the diff seat
# instead of being added beside it. Every number here is
# `branches * tools * tool_timeout`; recompute from the formula, never by feel.
#
# HONESTY LIMIT of that formula (henry finding, PR #130 round 4 → issue #131):
# it charges each branch ONE attempt, but a timeout is throttle-class and
# fails over, so a pathological round where primaries AND same-driver backups
# all time out can exceed the cap and be killed by GitHub mid-review. The
# formula prices the expected case; the job cap is the backstop for the
# pathological one. Failover-aware budget arithmetic is #131's scope.
job_budget_minutes = 110

# FLEET COMPOSITION (2026-08-31) — one gating seat, two trial seats running
# epic #160's stateful-vs-stateless A/B (#159).
#
# AMENDED 2026-09-07 — THE A/B BELOW IS OVER, AND EVERYTHING UNDER IT IS
# HISTORY. Both QwenCloud plans exhausted on the same day, so all three seats
# went dark together: henry (the gate), dorian (the stateless arm) and gray
# (the stateful arm). gray came back on ChatGPT/Codex through the `codex-proxy`
# preset and is now the gating seat; henry and dorian are still qwen and still
# dark, and are left in place rather than deleted because a plan window reopens
# and re-adding a seat by hand loses the reasoning attached to it.
#
# Read the rest of this block as the record of an experiment that did not
# finish, not as a description of what runs. What actually runs today is ONE
# active agentic seat (gray, codex) plus two entries waiting on quota. The
# reason the surviving seat is the one on a different provider is the whole
# lesson of the outage: three seats on two plans from one vendor is one
# credential away from an empty fleet, which is what the harness-diversity
# argument (docs/agentic-reviewer.md) says about context and is equally true
# about billing.
#
# WHY dorian IS GONE. The diff seat (openrouter/upstage/solar-pro4) was retired
# on its receipts: roughly 3 valid findings out of ~40 across four issues
# (#186, #189, #192, #197), including 18 consecutive declines on #197, several
# resting on demonstrable factual errors about the code it was reviewing. That
# is the same standard that retired deepseek-v4-pro from a gating seat in
# 2026-08: a seat whose findings cost more attention to refute than they add is
# worse than an empty seat. ACCEPTED COST, stated plainly: nothing exercises the
# PR-Agent diff path on this repo any more. If that path regresses, this fleet
# will not notice. Re-add a diff seat (on a different model) when the A/B ends.
# The pr-agent backup went with it — `_compatible_backups` keeps only
# SAME-driver backups, so with no pr-agent branch it could never be reached.
#
# THE A/B. #159 scores the stateful reviewer against the stateless one on the
# SAME model, so the state is the only variable, exactly as the 2026-08-19
# agentic-vs-diff trial held the model fixed and varied the harness. Both trial
# seats are non-gating; henry keeps the gate.
#
# THE VARIABLE IS THE STATE BUNDLE, both tiers at once. `coverage_ledger`
# (Tier 2, #157) was already per-entry; `findings_ledger` (Tier 1, #156) became
# per-entry in #159, which is what makes a genuinely stateless control
# expressible — before it, `carry_in`/`settle` ran for every agentic seat and
# BOTH arms of a stateful-vs-stateless experiment carried findings across
# rounds. The control turns both off, the treatment turns both on. That is a
# bundle rather than one knob on purpose: #159 asks whether the STATEFUL
# REVIEWER ships, and shipping it means both tiers; isolating which tier earns
# its keep is a question for a follow-up A/B on the tier that survives.
#
# `findings_ledger` defaults ON (opposite polarity to `coverage_ledger`), so
# `= true` on the treatment is redundant and written anyway: on a receipts
# experiment the arm that carries state should say so in the file being read
# next to the numbers.
#
# Tier 3 (repo-level digests, #158) is gated by the FUKO_DIGEST_RETRIEVAL env
# var, which is global rather than per-entry and is OFF. It is not part of this
# A/B; turning it on would change both arms at once.

# henry — DARK since 2026-09-07 (QwenCloud plan exhausted). Still `active`, so
# a round that finds the plan reopened gates on it again without an edit; until
# then it fails its branch on the first call. Left configured on purpose — the
# entry is cheap when dead and the reasoning below is not recoverable from a
# git log a year from now.
#
# It was the GATING seat: same provider, same model, same harness as both trial
# seats. Kept gating so a round still had a reviewer that was not part of the
# experiment. gray holds the gate now.
#
# NOT a twin of either arm, and the receipts must not be read as if it were:
# henry takes the defaults, which is Tier 1 ON and Tier 2 OFF — a third state
# configuration, and the one the fleet shipped with. It is the right thing for a
# gating seat (defaults are what everyone else runs) and the wrong thing to
# average into either arm's numbers, so `ab_metrics.py` keys arms on the seat's
# own config, never on "the other agentic seat".
#
# auth is PINNED to api-key: `auto` on a runner with a logged-in Claude session
# would resolve to subscription mode, which never injects a base URL — the seat
# would silently review with real Claude, the exact substitution class receipts
# exist to catch.
[[review.models]]
provider = "qwen-anthropic"
name = "qwen3.8-max"
max_context = 1000000
auth = "api-key"
backend = "agentic"
token_env = "FUKO_GITHUB_TOKEN_HENRY"

# dorian — DARK since 2026-09-07, same plan exhaustion as henry, and now a
# control with nothing to control for (see the amendment at the top). Kept as a
# trial so a reopened plan costs nothing that gates.
#
# It was #159's A/B control — the stateless arm. Inherits dorian's retired App
# identity; the name on the App no longer describes the seat, which is why
# receipts are scored by provider/model and role, never by bot login.
[[review.models]]
provider = "qwen-anthropic"
name = "qwen3.8-max"
max_context = 1000000
auth = "api-key"
backend = "agentic"
role = "trial"
coverage_ledger = false
findings_ledger = false
token_env = "FUKO_GITHUB_TOKEN_DORIAN"

# gray — the ChatGPT/Codex seat, ACTIVE and gating (2026-09-07).
#
# WHAT THIS REPLACED, said plainly: this slot was #159's stateful arm, and
# taking it ENDS that A/B rather than pausing it — a treatment arm with no
# surviving control measures nothing, and dorian (the control) is now a
# stateless qwen seat with nothing to be a control FOR. The experiment was
# already unrunnable: both QwenCloud plans exhausted on 2026-09-07 and all
# three seats went dark at once, which is also why the seat that came back is
# the one on a different provider. #159 stays open; re-running it needs a pair
# on ONE model again, and it can be any model — that was always the point.
#
# It is ACTIVE rather than trial because the alternative was no gate at all.
# henry and dorian are both still qwen and both still dark, so a non-gating
# codex seat would have left this repo merging with no fuko review whatsoever.
#
# It takes the state DEFAULTS (Tier 1 on, Tier 2 off) — no `coverage_ledger`
# or `findings_ledger` line — deliberately: those flags were the experiment's
# variable, and a gating seat should run what everyone else runs. Do not read
# this seat's receipts as either arm of #159.
#
# `max_context` is the ChatGPT PLAN's window for gpt-5.6, not the model's
# headline number. It sizes the harness's auto-compact; set too high, a long
# review dies at the upstream limit instead of compacting before it. RE-CHECK
# it when flipping the model (GPT-6 Astra), and re-check the preset's
# `small_model` against the account in the same pass.
#
# auth is PINNED for the same reason henry's is, with one extra tooth: for a
# `requires_base_url` preset fuko REFUSES subscription mode outright, because
# subscription injects no endpoint and this seat's `gpt-…` slugs are served
# ONLY by the loopback translator. The realistic way in is not writing
# `auth = "subscription"`; it is leaving `auth` at `auto` with CODEX_PROXY_KEY
# unexported. `base_url` is absent on purpose — the preset defaults it to the
# proxy's pinned listener, so the address stays a property of the runner.
#
# NO BACKUP, unchanged from below, and here it matters more: plan exhaustion
# answers 429 only after ~167s per attempt and the CLI retries, so an exhausted
# round spends real wall-clock before it says so. It still fails over honestly
# (or dies on tool_timeout, which is throttle-class too) — it is just slow to
# admit it. See docs/agentic-reviewer.md.
[[review.models]]
provider = "codex-proxy"
name = "gpt-5.6-sol"
max_context = 272000
auth = "api-key"
backend = "agentic"
role = "active"
token_env = "FUKO_GITHUB_TOKEN_GRAY"

# NO BACKUP as of 2026-09-01, on purpose. The z.ai seat that sat here was
# dropped so that account's capacity goes to mepro, which is in active
# development and needs its reviewers more than this repo does.
#
# ACCEPTED COST, stated plainly: a qwen exhaustion now ends the round with an
# honest "pool exhausted" receipt instead of spending ~3 min on a failover
# attempt. On a dogfood repo that is a fair trade; on mepro it would not be.
#
# THREE THINGS TO CARRY BACK when a backup is re-added, none of them obvious
# from the schema:
# - `backend = "agentic"` is REQUIRED, not decorative. `_compatible_backups`
#   filters a branch's pool to SAME-driver entries, so a backup without it
#   leaves every agentic seat above with an empty pool.
# - For z.ai specifically the provider is `zai-anthropic`, not the OpenAI-shaped
#   `zai-coding` — the agentic driver speaks the Anthropic API.
# - z.ai answering `1113` ("insufficient balance or no resource package") means
#   THROTTLED, not unpaid: verified by hand 2026-08-31 against `/api/anthropic`
#   AND `/api/coding/paas/v4` while the z.ai UI showed usage well below quota.
#   Do NOT re-diagnose that as a bad `glm-5.3` slug — the slug was never reached.
