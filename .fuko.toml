[review]
image = "ghcr.io/lemehmet/pr-agent:0.41.0@sha256:7341dc6214be964534ce3e68fc73143f3d642240829fe66894b87864db417223"
tool_timeout = 600
optional_tools = ["improve"]
# Must equal `timeout-minutes` in .github/workflows/fuko-pr-review.yml. The
# runner uses it to refuse a backup promotion whose sequential worst case
# (branches * tools * tool_timeout) would not fit the job -- an overrun kills the
# run mid-review, and a starved round is indistinguishable from a clean one.
# Keeping the number here means the arithmetic is checked at run time instead of
# being re-derived by hand whenever a backup is added (#106).
#
# THIS CAP IS DELIBERATELY OVERSIZED RIGHT NOW -- do not "correct" it. Neither
# backup names a token_env, so #106's identity rule refuses both promotions and
# the achievable worst case is 2 branches * 2 tools * 600s = 2400s = 40 min,
# i.e. this cap is ~2.75x it. It stays at 110 because #114 (giving backups their
# own identity) makes promotion possible again: promoting one backup gives
# 3 * 2 * 600s = 60 min and promoting both gives 4 * 2 * 600s = 80 min, plus
# setup. Churning the cap down now and up again on #114 is worse than carrying
# the headroom, and lowering it would silently re-introduce the mid-run kill the
# moment #114 lands. Every number here is `branches * tools * tool_timeout` and
# should be recomputed from that formula rather than adjusted by feel.
job_budget_minutes = 110

# FLEET COMPOSITION (2026-08-14) — two gating seats, two backups.
#
# WHY deepseek-v4-pro IS GONE. It held the `gray` seat and was dropped for
# persistently low-quality findings. The deciding example, on PR #100: it filed
# a CRITICAL-severity finding claiming the deny rules used a single leading
# slash. The code already emitted the correct `Read(//…)` form, and its
# suggested patch produced `Read(///…)` — the silently non-matching spelling.
# Applying that "critical fix" would have DISABLED the credential denylist it
# claimed to be protecting. A seat that inverts a security control while
# sounding most confident is worse than an empty seat, because it costs
# reviewer attention to refute.
#
# WHY qwen3.8-max REPLACES IT. Validated on mepro's trial seat. Kimi K3 was the
# other candidate and was rejected on cost.
#
# THIS FLEET IS GENUINELY MODEL-DIVERSE (glm + qwen) — do not "simplify" it back
# to one model on two providers. An earlier revision of this change had both
# gating seats on glm-5.2 via different providers; that buys provider diversity
# and failover only, and two seats running the same model agree on their blind
# spots by construction. The point of the second seat is a second opinion.
#
# BACKUP ORDER IS ABOUT THROTTLE BUCKETS, NOT PREFERENCE. Cooldown is global per
# provider because it keys on the shared API key (see `order_pool` in
# sidecar/pool.py, `cooled` keyed by provider id). gray and backup 1 both ride
# OPENROUTER_KEY, so a single OpenRouter throttle cools BOTH — a gray failover
# cannot land on backup 1, because whatever cooled gray has already cooled it.
# That makes backup 2 (ollama-cloud, its own OLLAMA_API_KEY) the only failover
# that survives an OpenRouter outage, and therefore load-bearing rather than
# decorative. dorian is unaffected either way: it holds a separate z.ai key.
# Backup 1 still stays FIRST on purpose — `order_pool` ranks available ahead of
# cooled, so backup 1 is used when OpenRouter is healthy and skipped when it is
# not. The order costs nothing and the coupling is handled by health, not by
# hand-ordering.

# dorian — gating seat.
[[review.models]]
provider = "zai-coding"
name = "glm-5.2"
max_context = 1000000
token_env = "FUKO_GITHUB_TOKEN_DORIAN"

# gray — gating seat. Distinct token_env from dorian: two resolvable identities
# is what keeps A/B concurrent. Collapse them and the run degrades to sequential
# (#106), which blows the job's time budget rather than merely losing a name.
[[review.models]]
provider = "openrouter"
name = "qwen/qwen3.8-max"
max_context = 1000000
token_env = "FUKO_GITHUB_TOKEN_GRAY"

# henry — TRIAL seat (non-gating): the agentic-vs-diff A/B, 2026-08-19.
# Same MODEL as gray (qwen3.8-max) on purpose: gray reviews the diff via
# PR-Agent, henry walks the checkout via the agentic driver (headless Claude
# Code on QwenCloud's Anthropic-compatible Token Plan endpoint), so every PR
# here gets the same model both ways and the harness is the only variable.
# Score receipts-only (uniqueness vs gray in particular); one of the two qwen
# seats is removed when the experiment concludes.
#
# auth is PINNED to api-key: `auto` on a runner with a logged-in Claude session
# would resolve to subscription mode, which never injects a base URL — the seat
# would silently review with real Claude, the exact substitution class receipts
# exist to catch.
#
# KNOWN LIMITS while trialing (accepted, on a repo where reviews gate nothing):
# - Until the fuko-henry App exists (vars.FUKO_HENRY_APP_ID +
#   secrets.FUKO_HENRY_APP_PRIVATE_KEY), FUKO_GITHUB_TOKEN_HENRY is empty and
#   EVERY round runs sequentially under the base identity (#106 identity rule
#   is all-or-nothing). Budget still fits: 3 branches * 2 tools * 600s = 60m,
#   escalated worst 5 * 2 * 600s = 100m, under the 110m cap.
# - Mixed backends freeze backup escalation for the round (plan_escalation
#   refuses to promote across drivers) — fix that before any agentic seat
#   enters a GATING fleet (mepro).
# - The shared backups are pr-agent-only: if henry's endpoint throttles, the
#   cross-driver failover fails the branch rather than substituting a
#   different harness mid-experiment. That is the honest outcome for an A/B.
[[review.models]]
provider = "qwen-anthropic"
name = "qwen3.8-max"
max_context = 1000000
auth = "api-key"
backend = "agentic"
role = "trial"
token_env = "FUKO_GITHUB_TOKEN_HENRY"

# Backup 1 — shares OPENROUTER_KEY with gray; see the throttle-bucket note above.
[[review.models]]
provider = "openrouter"
name = "z-ai/glm-5.2"
max_context = 1048576
role = "backup"

# Backup 2 — the OpenRouter-outage survivor. Backups intentionally carry no
# token_env: a promoted backup posts under the identity of the seat it covers.
[[review.models]]
provider = "ollama-cloud"
name = "glm-5.2:cloud"
max_context = 976000
role = "backup"
